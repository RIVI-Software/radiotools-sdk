scalar JSON

  type Query {
    station: Station!
    schemas(type: String, version: Int): [ContentSchema!]!
    content(type: String!, cursor: ID, limit: Int = 25): ContentCollection!
    contentRecord(id: ID!): PublishedRecord!
    schedule(fromDate: String!, throughDate: String!): Schedule!
    programs(fromDate: String!, throughDate: String!): Programs!
    currentBroadcast: CurrentBroadcast!
    nowPlaying: NowPlaying!
    trackHistory(cursor: String, limit: Int = 25): TrackHistory!
    weather: Weather
    traffic: Traffic
  }

  type Mutation {
    previewEditorial(input: PreviewInput!): RevisionPreview!
  }

  type Station {
    contractVersion: Int!
    id: ID!
    slug: String!
    name: String!
    timezone: String!
    publishingLanguage: String!
    resources: StationResources!
    delivery: StationDelivery!
  }

  type StationResources {
    schemas: String!
    content: String
    schedule: String
    programs: String
    broadcast: String
    nowPlaying: String
    trackHistory: String
    socket: String
    weather: String
    traffic: String
    media: String!
  }

  type StationDelivery {
    cache: String!
    conditional: String!
    pollIntervalSeconds: Int!
  }

  type ContentSchema {
    key: String!
    label: String!
    version: Int!
    archived: Boolean!
    fields: JSON!
  }

  type ContentCollection {
    records: [PublishedRecord!]!
    nextCursor: ID
  }

  type PublishedRecord {
    id: ID!
    publicationId: ID!
    revision: Int!
    type: String!
    schemaVersion: Int!
    publishedAt: String!
    values: JSON!
    document: JSON!
    media: [PublicMedia!]!
  }

  type PublicMedia {
    assetId: ID!
    versionId: ID!
    kind: String!
    url: String!
    credits: String!
    mime: String!
  }

  type Schedule {
    contractVersion: Int!
    timezone: String!
    broadcasts: [Broadcast!]!
    truncated: Boolean!
  }

  type Programs {
    contractVersion: Int!
    timezone: String!
    fromDate: String!
    throughDate: String!
    programs: [ProgramSummary!]!
    truncated: Boolean!
  }

  type ProgramSummary {
    id: ID!
    title: String!
    profileId: ID
  }

  type CurrentBroadcast {
    contractVersion: Int!
    timezone: String!
    asOf: String!
    broadcast: Broadcast
  }

  type NowPlaying {
    contractVersion: Int!
    stationId: ID!
    timezone: String!
    track: PlaybackTrack
    elapsedSeconds: Int
    endsAt: String
    freshness: PlaybackFreshness!
  }

  type PlaybackTrack {
    artist: String!
    title: String!
    album: String
    durationSeconds: Int
    artworkUrl: String
    isPlaying: Boolean!
    observedAt: String!
    receivedAt: String!
  }

  type PlaybackFreshness {
    status: String!
    thresholdSeconds: Int!
    ageSeconds: Int
    observedAt: String
    receivedAt: String
  }

  type TrackHistory {
    contractVersion: Int!
    stationId: ID!
    items: [HistoryEntry!]!
    nextCursor: String
  }

  type HistoryEntry {
    id: ID!
    artist: String!
    title: String!
    album: String
    durationSeconds: Int
    artworkUrl: String
    isPlaying: Boolean!
    observedAt: String!
    receivedAt: String!
  }

  type Broadcast {
    id: ID!
    title: String!
    startsAt: String!
    endsAt: String!
    timezone: String!
    localDate: String!
    resolution: String!
    status: String!
    cancellationReason: String!
    repeatOfId: ID
    program: BroadcastProgram!
    presenters: [BroadcastPresenter!]!
  }

  type BroadcastProgram {
    id: ID!
    title: String!
    profileId: ID
  }

  type BroadcastPresenter {
    id: ID!
    title: String!
  }

  type Weather {
    stationId: ID!
    timezone: String!
    snapshots: JSON!
  }

  type Traffic {
    stationId: ID!
    snapshot: JSON!
  }

  input PreviewInput {
    stationId: ID!
    recordId: ID!
    revision: Int!
    audience: String!
  }

  type RevisionPreview {
    id: ID!
    revision: Int!
    schemaVersion: Int!
    values: JSON!
    document: JSON!
    media: [PublicMedia!]!
  }
